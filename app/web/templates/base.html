<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{% block title %}planner{% endblock %}</title>

    <!-- PWA -->
    <link rel="manifest" href="/web/static/manifest.json">
    <meta name="theme-color" content="#0d0d0f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📅</text></svg>">


    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            900: '#0d0d0f',
                            800: '#1a1a2e',
                            700: '#252540',
                            600: '#2f2f4f',
                            500: '#3a3a5c',
                        },
                        accent: {
                            DEFAULT: '#3b82f6',
                            hover: '#2563eb',
                        },
                        success: '#22c55e',
                        warning: '#f59e0b',
                        danger: '#ef4444',
                    }
                }
            }
        }
    </script>

    <!-- HTMX CDN -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>

    <!-- Alpine.js CDN -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <style>
        [x-cloak] { display: none !important; }
    </style>

    <!-- Custom styles -->
    <link rel="stylesheet" href="/web/static/css/style.css">

    {% block extra_head %}{% endblock %}
</head>
<body class="bg-dark-900 text-gray-200 min-h-screen" x-data="{ sidebarOpen: false }">
    <!-- Mobile Top Bar -->
    <header class="lg:hidden bg-dark-800 border-b border-dark-600 p-4 flex justify-between items-center sticky top-0 z-50">
        <h1 class="text-lg font-bold text-white flex items-center">
            <span class="mr-2 text-xl">📅</span> Planner
        </h1>
        <button @click="sidebarOpen = !sidebarOpen" class="p-2 text-gray-400 hover:text-white focus:outline-none">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path x-show="!sidebarOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                <path x-show="sidebarOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
        </button>
    </header>

    <div class="flex min-h-screen">
        <!-- Sidebar Navigation -->
        <aside 
            :class="sidebarOpen ? 'translate-x-0' : '-translate-x-full'"
            class="fixed inset-y-0 left-0 w-64 bg-dark-800 border-r border-dark-600 flex flex-col z-[60] transition-transform duration-300 ease-in-out lg:relative lg:translate-x-0 shadow-2xl">
            
            <!-- Mobile Sidebar Header (inside aside) -->
            <div class="lg:hidden p-4 border-b border-dark-600 flex justify-between items-center">
                <h1 class="text-lg font-bold text-white flex items-center">
                    <span class="mr-2 text-xl">📅</span> Planner
                </h1>
                <button @click="sidebarOpen = false" class="p-2 text-gray-400">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>

            <!-- Nav Links -->
            <nav class="flex-1 p-4 space-y-2 overflow-y-auto pt-8 lg:pt-4">
                <a href="/" @click="sidebarOpen = false"
                   class="flex items-center px-4 py-4 lg:py-3 rounded-lg transition-colors
                          {% if request.url.path == '/' %}bg-accent text-white{% else %}text-gray-400 hover:bg-dark-700 hover:text-white{% endif %}">
                    <span class="mr-3 text-xl lg:text-base">📊</span>
                    <span class="font-medium lg:font-normal">Дашборд</span>
                </a>

                <a href="/calendar" @click="sidebarOpen = false"
                   class="flex items-center px-4 py-4 lg:py-3 rounded-lg transition-colors
                          {% if request.url.path == '/calendar' %}bg-accent text-white{% else %}text-gray-400 hover:bg-dark-700 hover:text-white{% endif %}">
                    <span class="mr-3 text-xl lg:text-base">📅</span>
                    <span class="font-medium lg:font-normal">Календарь</span>
                </a>

                <a href="/categories" @click="sidebarOpen = false"
                   class="flex items-center px-4 py-4 lg:py-3 rounded-lg transition-colors
                          {% if request.url.path == '/categories' %}bg-accent text-white{% else %}text-gray-400 hover:bg-dark-700 hover:text-white{% endif %}">
                    <span class="mr-3 text-xl lg:text-base">📂</span>
                    <span class="font-medium lg:font-normal">Категории</span>
                </a>

                <a href="/recurring" @click="sidebarOpen = false"
                   class="flex items-center px-4 py-4 lg:py-3 rounded-lg transition-colors
                          {% if request.url.path == '/recurring' %}bg-accent text-white{% else %}text-gray-400 hover:bg-dark-700 hover:text-white{% endif %}">
                    <span class="mr-3 text-xl lg:text-base">🔄</span>
                    <span class="font-medium lg:font-normal">Периодические</span>
                </a>

                <a href="/stats" @click="sidebarOpen = false"
                   class="flex items-center px-4 py-4 lg:py-3 rounded-lg transition-colors
                          {% if request.url.path == '/stats' %}bg-accent text-white{% else %}text-gray-400 hover:bg-dark-700 hover:text-white{% endif %}">
                    <span class="mr-3 text-xl lg:text-base">📈</span>
                    <span class="font-medium lg:font-normal">Статистика</span>
                </a>

                <a href="/backlog" @click="sidebarOpen = false"
                   class="flex items-center px-4 py-4 lg:py-3 rounded-lg transition-colors
                          {% if request.url.path == '/backlog' %}bg-accent text-white{% else %}text-gray-400 hover:bg-dark-700 hover:text-white{% endif %}">
                    <span class="mr-3 text-xl lg:text-base">📥</span>
                    <span class="font-medium lg:font-normal">Бэклог</span>
                </a>

                <a href="/archive" @click="sidebarOpen = false"
                   class="flex items-center px-4 py-4 lg:py-3 rounded-lg transition-colors
                          {% if request.url.path == '/archive' %}bg-accent text-white{% else %}text-gray-400 hover:bg-dark-700 hover:text-white{% endif %}">
                    <span class="mr-3 text-xl lg:text-base">🗄️</span>
                    <span class="font-medium lg:font-normal">Архив</span>
                </a>

                <a href="/finance" @click="sidebarOpen = false"
                   class="flex items-center px-4 py-4 lg:py-3 rounded-lg transition-colors
                          {% if request.url.path == '/finance' %}bg-accent text-white{% else %}text-gray-400 hover:bg-dark-700 hover:text-white{% endif %}">
                    <span class="mr-3 text-xl lg:text-base">💰</span>
                    <span class="font-medium lg:font-normal">Финансы</span>
                </a>
            </nav>
        </aside>

        <!-- Sidebar Overlay (mobile) -->
        <div 
            x-show="sidebarOpen" 
            @click="sidebarOpen = false" 
            class="fixed inset-0 bg-black/50 z-30 lg:hidden"
            x-transition:enter="transition opacity-ease-out duration-300"
            x-transition:enter-start="opacity-0"
            x-transition:enter-end="opacity-100"
            x-transition:leave="transition opacity-ease-in duration-300"
            x-transition:leave-start="opacity-100"
            x-transition:leave-end="opacity-0">
        </div>

        <!-- Main Content -->
        <main class="flex-1 p-4 lg:p-8 overflow-y-auto w-full">
            {% block content %}{% endblock %}
        </main>
    </div>

    {% block extra_scripts %}{% endblock %}
</body>
</html>
