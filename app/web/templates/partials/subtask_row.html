{% from 'partials/icons_macros.html' import icon_check, icon_trash %}
<div id="subtask-row-{{ sub.id }}" class="flex items-start gap-2 text-sm {{ 'opacity-50 line-through text-gray-600' if sub.status == 'выполнена' else '' }}">
    {% if sub.status != 'выполнена' %}
    <form hx-post="/tasks/{{ sub.id }}/complete-subtask"
          hx-target="#subtask-row-{{ sub.id }}"
          hx-swap="outerHTML"
          class="inline">
        <button type="submit" class="icon-action icon-action--success !p-1" title="Выполнить">
            {{ icon_check('w-4 h-4') }}
        </button>
    </form>
    {% else %}
    <span class="icon-action icon-action--success !p-1 opacity-40 cursor-default">{{ icon_check('w-4 h-4') }}</span>
    {% endif %}
    <span class="flex-1 min-w-0 break-words text-gray-300 leading-snug">{{ sub.title }}</span>
    <button hx-delete="/tasks/{{ sub.id }}/subtask"
            hx-target="#subtasks-{{ parent_id }}"
            hx-swap="innerHTML"
            class="icon-action icon-action--danger !p-1"
            title="Удалить">
        {{ icon_trash() }}
    </button>
</div>
