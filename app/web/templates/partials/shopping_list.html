{% if items %}
    {% for item in items %}
    <div class="bg-dark-800 rounded-lg p-2 px-3 border border-dark-700 hover:border-yellow-600/50 transition flex items-center gap-2"
         id="item-{{ item.id }}">
        <form hx-post="/api/shopping/{{ item.id }}/toggle" hx-target="#shopping-list" hx-swap="innerHTML" class="flex-shrink-0">
            <button type="submit" class="text-lg text-gray-600 hover:text-green-400" title="Куплено">⬜</button>
        </form>
        <div class="flex-1 min-w-0">
            <span class="font-medium text-sm text-white truncate block" title="{{ item.title }}">
                {{ item.title }}
            </span>
        </div>
        <form hx-delete="/api/shopping/{{ item.id }}" hx-target="#shopping-list" hx-swap="innerHTML" class="flex-shrink-0">
            <button type="submit" class="text-gray-500 hover:text-red-400 text-xs" title="Удалить">🗑</button>
        </form>
    </div>
    {% endfor %}
{% else %}
    <div class="text-center py-10 text-gray-500">
        <p>Список покупок пуст 🛒</p>
    </div>
{% endif %}
