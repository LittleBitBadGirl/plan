<form hx-post="/tasks/create"
      hx-target="#tasks-list"
      hx-swap="innerHTML"
      hx-on::after-request="this.reset(); const ta = this.querySelector('textarea'); ta.style.height = 'auto'; ta.focus();"
      class="flex flex-col gap-2"
      x-data="{
          resize() {
              const el = $el.querySelector('textarea');
              el.style.height = 'auto';
              el.style.height = el.scrollHeight + 'px';
          },
          submitIfEnter(e) {
              if (!e.shiftKey) {
                  e.preventDefault();
                  $el.requestSubmit();
              }
          }
      }">
    <div class="flex gap-2 items-end">
        <textarea name="title" required
                  rows="1"
                  enterkeyhint="go"
                  autocomplete="off"
                  autocapitalize="sentences"
                  @input="resize()"
                  @keydown.enter="submitIfEnter($event)"
                  placeholder="Что нужно сделать?"
                  class="flex-1 min-w-0 bg-dark-700 border border-dark-500 rounded-lg px-3 py-3 lg:py-2.5 text-white placeholder-gray-500 focus:outline-none focus:border-accent transition-all resize-none min-h-[48px] lg:min-h-[44px] text-base lg:text-sm leading-snug"></textarea>

        <div class="relative shrink-0 hidden sm:block">
            <select name="category_id"
                    class="absolute inset-0 w-full h-full opacity-0 z-10 cursor-pointer">
                <option value="">Категория</option>
                {% for cat in categories %}
                    {% if cat.is_global %}
                        <optgroup label="{{ cat.name }}">
                            {% for subcat in categories %}
                                {% if subcat.parent_id == cat.id %}
                                <option value="{{ subcat.id }}">{{ subcat.name }}</option>
                                {% endif %}
                            {% endfor %}
                        </optgroup>
                    {% endif %}
                {% endfor %}
            </select>
            <div class="bg-dark-700 border border-dark-500 rounded-lg w-11 h-11 lg:w-10 lg:h-10 flex items-center justify-center text-gray-400" title="Категория">
                {{ icon_folder('w-4 h-4') }}
            </div>
        </div>

        {# Достижение: на телефоне — компактная кнопка, на десктопе — кнопка
           размером с «Новая задача» в шапке. #}
        <button type="button" onclick="openAchievementQuickAdd()"
                class="lg:hidden shrink-0 w-12 h-12 border border-amber-800/60 text-amber-500 rounded-xl transition-all flex items-center justify-center active:scale-95"
                aria-label="Записать достижение" title="Записать достижение">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
                      d="M12 3.6l2.6 5.3 5.8.8-4.2 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8L3.6 9.7l5.8-.8z"></path>
            </svg>
        </button>
        <button type="button" onclick="openAchievementQuickAdd()"
                class="hidden lg:inline-flex shrink-0 items-center px-4 py-2.5 border border-amber-800/60 hover:border-amber-600 text-amber-500 hover:text-amber-400 text-sm font-bold rounded-xl transition-all whitespace-nowrap active:scale-95"
                title="Записать достижение">
            <span class="mr-1.5 text-lg leading-none">+</span> достижение
        </button>

        <button type="submit"
                class="lg:hidden shrink-0 w-12 h-12 bg-accent hover:bg-blue-600 active:scale-95 text-white font-bold rounded-xl transition-all flex items-center justify-center text-xl shadow-lg"
                aria-label="Добавить задачу">
            +
        </button>

        {# «Добавить» стоит в той же строке: блок добавления — одна строка, как
           сводка рядом, а не две строки с кнопкой во всю ширину. #}
        <button type="submit"
                class="hidden lg:inline-flex shrink-0 items-center px-5 py-2.5 bg-accent hover:bg-blue-600 text-white font-bold rounded-xl transition-all text-sm shadow-lg active:scale-95 whitespace-nowrap">
            Добавить
        </button>
    </div>
</form>
