{# Решение по мероприятию: «Иду» / «Не иду». Нажатие по выбранной кнопке
   снимает отметку. ev_target и ev_board_flag задаёт тот блок, откуда нажали
   (доска на странице или блок недели на дашборде). #}
<form class="ev-actions"
      hx-post="/api/events/{{ item.id }}/status"
      hx-target="{{ ev_target|default('#events-board') }}"
      hx-swap="outerHTML">
    <input type="hidden" name="board" value="{{ ev_board_flag|default('1') }}">
    <input type="hidden" name="month" value="{{ ev_month }}">
    <input type="hidden" name="day" value="{{ ev_day }}">
    <button type="submit" name="value" value="going"
            class="ev-status ev-status--going {% if item.status == 'going' %}is-on{% endif %}">Иду</button>
    <button type="submit" name="value" value="not_going"
            class="ev-status ev-status--no {% if item.status == 'not_going' %}is-on{% endif %}">Не иду</button>
</form>
