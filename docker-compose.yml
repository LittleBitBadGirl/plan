version: '3.8'

services:
  planner:
    build: .
    container_name: task_planner
    # Не открываем 8000 в интернет — только Nginx Proxy Manager (сеть npm_default).
    # Проверка с VPS: docker exec task_planner curl -s http://127.0.0.1:8000/api/health
    volumes:
      - .:/app
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/planner.db
      - AI_DEVICE=cpu
    networks:
      - npm_default
    restart: unless-stopped

  bot:
    build: .
    container_name: telegram_bot
    command: python run_bot.py
    volumes:
      - .:/app
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/planner.db
    networks:
      - npm_default
    restart: unless-stopped

networks:
  npm_default:
    external: true
