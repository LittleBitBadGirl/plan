version: '3.8'

services:
  planner:
    build: .
    container_name: task_planner
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/planner.db
      - AI_DEVICE=cpu
    networks:
      - npm_default
    restart: unless-stopped

  bot:
    build: .
    container_name: telegram_bot
    command: python run_bot.py
    volumes:
      - .:/app
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/planner.db
    networks:
      - npm_default
    restart: unless-stopped

networks:
  npm_default:
    external: true
