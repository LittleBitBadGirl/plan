name: Deploy to VPS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Deploy via SSH
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.VPS_HOST }}
        username: root
        key: ${{ secrets.VPS_SSH_KEY }}
        script: |
          cd /opt/projects/planner
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/id_ed25519_deploy -o StrictHostKeyChecking=no"
          git fetch origin main
          git reset --hard origin/main
          docker rm -f task_planner telegram_bot 2>/dev/null || true
          docker compose build --no-cache
          docker compose up -d
          docker system prune -f
